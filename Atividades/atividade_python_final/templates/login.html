{% extends "base.html" %}
{% block content %}
<div class="card mx-auto shadow-sm" style="max-width: 400px;">
    <div class="card-body">
        <h3 class="text-center mb-4"><i class="bi bi-box-arrow-in-right"></i> Login</h3>
        <form action="/login" method="POST">
            <input type="email" name="email" class="form-control mb-3" placeholder="Seu Email" required>
            <input type="password" name="senha" class="form-control mb-3" placeholder="Sua Senha" required>
            <button type="submit" class="btn btn-success w-100">Entrar</button>
        </form>
        <p class="mt-3 text-center"><a href="/registro">Não tem conta? Registre-se</a></p>
    </div>
</div>
{% endblock %}
