{% extends "base.html" %}
{% block content %}
<h3 class="mb-4 text-center"><i class="bi bi-pie-chart"></i> Dashboard de Progresso</h3>

<div class="card shadow-sm p-4 mx-auto bg-white" style="max-width: 500px;">
    <canvas id="graficoTarefas"></canvas>
</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script>
    fetch('/api/grafico')
        .then(response => response.json())
        .then(dados => {
            const ctx = document.getElementById('graficoTarefas').getContext('2d');
            new Chart(ctx, {
                type: 'pie',
                data: {
                    labels: ['Pendentes', 'Em Andamento', 'Concluídas'],
                    datasets: [{
                        data: [dados.pendentes, dados.andamento, dados.concluidas],
                        backgroundColor: ['#ffc107', '#0d6efd', '#198754'],
                        borderWidth: 0
                    }]
                },
                options: {
                    plugins: {
                        legend: {
                            position: 'bottom'
                        }
                    }
                }
            });
        });
</script>
{% endblock %}
