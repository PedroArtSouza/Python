{% extends "base.html" %}
{% block content %}
<div class="card mx-auto shadow-sm" style="max-width: 400px;">
    <div class="card-body">
        <h3 class="text-center mb-4"><i class="bi bi-person-plus"></i> Registrar</h3>
        <form action="/registro" method="POST">
            <input type="text" name="nome" class="form-control mb-3" placeholder="Seu Nome" required>
            <input type="email" name="email" class="form-control mb-3" placeholder="Seu Email" required>
            <input type="password" name="senha" class="form-control mb-3" placeholder="Crie uma Senha" required>
            <button type="submit" class="btn btn-primary w-100">Criar Conta</button>
        </form>
        <p class="mt-3 text-center"><a href="/login">Já tem conta? Faça login</a></p>
    </div>
</div>
{% endblock %}
