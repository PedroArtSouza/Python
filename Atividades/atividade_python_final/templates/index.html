{% extends "base.html" %}
{% block content %}
<div class="alert alert-info shadow-sm">
    <strong><i class="bi bi-lightbulb"></i> Conselho do dia:</strong> {{ conselho }}
</div>

<h4 class="mb-4">Olá, {{ session['nome'] }}! Suas Tarefas</h4>

<form action="/nova_tarefa" method="POST" class="row g-2 mb-4">
    <div class="col-md-4">
        <input type="text" name="titulo" class="form-control" placeholder="Título da tarefa" required>
    </div>
    <div class="col-md-6">
        <input type="text" name="descricao" class="form-control" placeholder="Descrição (opcional)">
    </div>
    <div class="col-md-2">
        <button type="submit" class="btn btn-primary w-100"><i class="bi bi-plus-circle"></i> Adicionar</button>
    </div>
</form>

<div class="mb-4 bg-white p-3 rounded shadow-sm text-dark d-inline-block">
    <label class="form-label fw-bold mb-1">Filtrar por Status:</label>
    <select id="filtroStatus" class="form-select" onchange="carregarTarefas()">
        <option value="todas">Todas</option>
        <option value="pendente">Pendentes</option>
        <option value="em andamento">Em Andamento</option>
        <option value="concluída">Concluídas</option>
    </select>
</div>

<div class="row" id="containerTarefas"></div>

<script>
    function carregarTarefas() {
        let status = document.getElementById('filtroStatus').value;
        
        fetch(`/api/tarefas?status=${status}`)
            .then(response => response.json())
            .then(data => {
                let container = document.getElementById('containerTarefas');
                container.innerHTML = ''; 
                
                if(data.length === 0){
                    container.innerHTML = '<div class="col-12"><p class="text-muted">Nenhuma tarefa encontrada.</p></div>';
                    return;
                }

                data.forEach(tarefa => {
                    let corCard = 'bg-warning text-dark'; 
                    if (tarefa.status === 'em andamento') corCard = 'bg-primary text-white';
                    if (tarefa.status === 'concluída') corCard = 'bg-success text-white';

                    let html = `
                    <div class="col-md-4 mb-3">
                        <div class="card ${corCard} shadow-sm h-100">
                            <div class="card-body d-flex flex-column">
                                <h5 class="card-title fw-bold">${tarefa.titulo}</h5>
                                <p class="card-text mb-4">${tarefa.descricao}</p>
                                
                                <div class="mt-auto">
                                    <form action="/editar_status/${tarefa.id}" method="POST" class="mb-2">
                                        <select name="status" class="form-select form-select-sm" onchange="this.form.submit()">
                                            <option value="pendente" ${tarefa.status === 'pendente' ? 'selected' : ''}>Pendente</option>
                                            <option value="em andamento" ${tarefa.status === 'em andamento' ? 'selected' : ''}>Em Andamento</option>
                                            <option value="concluída" ${tarefa.status === 'concluída' ? 'selected' : ''}>Concluída</option>
                                        </select>
                                    </form>
                                    <a href="/excluir/${tarefa.id}" class="btn btn-danger btn-sm w-100"><i class="bi bi-trash"></i> Excluir</a>
                                </div>
                            </div>
                        </div>
                    </div>`;
                    container.innerHTML += html;
                });
            });
    }
    carregarTarefas();
</script>
{% endblock %}
