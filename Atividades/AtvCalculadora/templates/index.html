<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Calculadora</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>


    <h1>Calculadora</h1>

    <div id="calculator">
        <!-- POST envia os dados para o Flask; a função calcular() no Python faz a conta -->
        <form method="POST" action="{{ url_for('index') }}">

            <div class="form-grupo">
                <label for="operacao">Operação</label>
                {% set op = request.form.get('operacao', '+') %}
                <select id="operacao" name="operacao" required onchange="atualizarNum2()">
                    <option value="+" {% if op == '+' %}selected{% endif %}>+ Somar</option>
                    <option value="-" {% if op == '-' %}selected{% endif %}>- Subtrair</option>
                    <option value="*" {% if op == '*' %}selected{% endif %}>x Multiplicar</option>
                    <option value="/" {% if op == '/' %}selected{% endif %}>÷ Dividir</option>
                    <option value="**" {% if op == '**' %}selected{% endif %}>^ Potência</option>
                    <option value="sqrt" {% if op == 'sqrt' %}selected{% endif %}>√ Raiz quadrada</option>
                    <option value="log" {% if op == 'log' %}selected{% endif %}>Log</option>
                    <option value="bhaskara" {% if op == 'bhaskara'%}selected{%endif%}>Bhaskara</option>
                </select>
            </div>

            <div class="form-grupo">
                <label for="num1">Primeiro número</label>
                <input type="number" id="num1" name="num1" step="any" required
                       value="{{ request.form.get('num1', '') }}">
            </div>


            <div class="form-grupo" id="grupo-num2">
                <label for="num2">Segundo número</label>
                <input type="number" id="num2" name="num2" step="any"
                       value="{{ request.form.get('num2', '') }}">
            </div>

            <div class="form-grupo" id="grupo-num3">
                <label for="num3">Terceiro número</label>
                <input type="number" id="num3" name="num3" step="any"
                    value="{{ request.form.get('num3', '') }}">
            </div>


            <button type="submit">Calcular</button>
        </form>


        {% if etapas %}
        <div class="resultado">
            <strong>Resposta do servidor (Python):</strong>
            <div>{{ etapas }}</div>
            <div>Resultado: {{ resultado }}</div>
        </div>
        {% endif %}


        <a href="{{ url_for('index') }}">Limpar / nova conta</a>
    </div>


    <script>
        function atualizarNum2() {
            const operacao = document.getElementById("operacao").value;
            const num2 = document.getElementById("num2");
            const grupo = document.getElementById("grupo-num2");
            const num3 = document.getElementById("num3");
            const grupo3 = document.getElementById("grupo-num3");

            const esconderNum3 = (operacao === "bhaskara")

            if (esconderNum3) {
                grupo3.style.display = "block";
                num3.required = true;    

            } else {
                grupo3.style.display = "none";
                num3.value = "";         
                num3.required = false;   

            }

      
            const esconderNum2 = (operacao === "sqrt" || operacao === "log");

            if (esconderNum2) {
                grupo.style.display = "none";
                num2.value = "";         
                num2.required = false;    
            } else {
                grupo.style.display = "block";
                num2.required = true;     
            }
        }
        
        atualizarNum2();
    </script>


</body>
</html>
